<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra AI - Web Interface</title>

<style>
:root {
  --bg: #000000;
  --surface: rgba(15, 23, 42, 0.35);
  --border: rgba(255, 255, 255, 0.08);
  --text: #e5e7eb;
  --muted: #9ca3af;
  --primary: #7aa2ff;
  --radius-lg: 24px;
  --shadow-soft: 0 20px 60px rgba(0, 0, 0, 0.9);
}

/* Global */
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  overflow: hidden;
}

/* Starfield canvas */
#starfield {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: #000000;
}

/* App shell */
.app {
  position: relative;
  width: 100%;
  max-width: 900px;
  height: 80vh; /* fixed, stable size */
  background: var(--surface);
  backdrop-filter: blur(22px) saturate(180%);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  margin: auto;
}

/* Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(15, 23, 42, 0.6);
}

.app-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.app-star {
  font-size: 18px;
  color: var(--primary);
  text-shadow: 0 0 10px rgba(122, 162, 255, 0.8);
}

.app-title-text {
  display: flex;
  flex-direction: column;
}

.app-title-text span:first-child {
  font-weight: 600;
  letter-spacing: 0.04em;
}

.app-title-text span:last-child {
  font-size: 12px;
  color: var(--muted);
}

.app-pill {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: var(--muted);
  background: rgba(15, 23, 42, 0.7);
}

/* Main layout */
.app-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 12px 16px 14px;
  gap: 10px;
}

/* Chat area */
.chat-container {
  flex: 1;
  overflow: hidden;
  padding: 0;
  background: transparent;
  border: none;
}

.chat-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.chat-scroll::-webkit-scrollbar {
  width: 6px;
}
.chat-scroll::-webkit-scrollbar-track {
  background: transparent;
}
.chat-scroll::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.4);
  border-radius: 999px;
}

/* Messages */
#messages {
  list-style: none;
  padding: 0;
  margin: 0;
}

.message {
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  max-width: 80%;
  animation: fadeInUp 0.25s ease-out forwards;
  opacity: 0;
  transform: translateY(4px);
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user {
  margin-left: auto;
  align-items: flex-end;
}

.message.bot {
  align-items: flex-start;
}

.bubble {
  padding: 10px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 15px;
  line-height: 1.55;
}

.message.user .bubble {
  background: rgba(122, 162, 255, 0.12);
  border-color: rgba(122, 162, 255, 0.25);
}

.message.bot .bubble {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.12);
}

.meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}

/* Typing indicator */
.typing-indicator-wrapper {
  display: inline-flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 0 14px rgba(122, 162, 255, 0.5);
}

.typing-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.typing-indicator .dot {
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--primary);
  opacity: 0.5;
  animation: typingPulse 1.4s infinite;
}

.typing-indicator .dot:nth-child(1) { animation-delay: 0s; }
.typing-indicator .dot:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator .dot:nth-child(3) { animation-delay: 0.3s; }

@keyframes typingPulse {
  0% {
    transform: translateY(0);
    opacity: 0.35;
    box-shadow: 0 0 0 rgba(122, 162, 255, 0.0);
  }
  35% {
    transform: translateY(-3px);
    opacity: 1;
    box-shadow: 0 0 8px rgba(122, 162, 255, 0.9);
  }
  70% {
    transform: translateY(0);
    opacity: 0.35;
    box-shadow: 0 0 0 rgba(122, 162, 255, 0.0);
  }
}

/* Input area */
.input-shell {
  border-radius: 18px;
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.input-row {
  display: grid;
  grid-template-columns: 1fr 72px;
  gap: 8px;
  align-items: stretch;
}

textarea {
  width: 100%;
  min-height: 44px;
  max-height: 120px;
  resize: vertical;
  padding: 10px 11px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(15, 23, 42, 0.95);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}

textarea::placeholder {
  color: rgba(148, 163, 184, 0.8);
}

textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 1px rgba(122, 162, 255, 0.6);
}

button {
  width: 100%;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, #7aa2ff, #4f46e5);
  color: #f9fafb;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 12px 30px rgba(79, 70, 229, 0.7);
  transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.18s ease;
}

button span.icon {
  font-size: 14px;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 16px 36px rgba(79, 70, 229, 0.9);
  filter: brightness(1.05);
}

button:active {
  transform: translateY(0);
  box-shadow: 0 10px 24px rgba(79, 70, 229, 0.8);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  box-shadow: none;
}

.input-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--muted);
}

.status {
  min-height: 16px;
}

/* Responsive */
@media (max-width: 600px) {
  body {
    padding: 8px;
  }
  .app {
    height: 90vh;
    border-radius: 18px;
  }
  .message {
    max-width: 90%;
  }
}
</style>
</head>

<body>
<canvas id="starfield"></canvas>

<div class="app" role="application" aria-label="Astra AI chat">
  <header class="app-header">
    <div class="app-title">
      <span class="app-star" aria-hidden="true">✦</span>
      <div class="app-title-text">
        <span>Astra AI</span>
        <span>Conversational Intelligence</span>
      </div>
    </div>
    <div class="app-pill">Night Mode</div>
  </header>

  <main class="app-main">
    <section class="chat-container" aria-label="Chat transcript">
      <div class="chat-scroll" id="chat-container">
        <ul id="messages" role="log" aria-live="polite" aria-relevant="additions"></ul>
      </div>
    </section>

    <section class="input-shell">
      <form id="chat-form" aria-label="Send a message">
        <div class="input-row">
          <textarea
            id="user-input"
            name="message"
            placeholder="Ask Astra anything…"
            aria-label="Type your message"
          ></textarea>
          <button id="send-btn" type="submit" aria-label="Send message">
            <span class="icon">➤</span>
            <span>Send</span>
          </button>
        </div>
        <div class="input-meta">
          <div>Enter to send • Shift+Enter for newline</div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
      </form>
    </section>
  </main>
</div>

<noscript>JavaScript is required to use the chat. Please enable JavaScript.</noscript>

<script>
/* Starfield + constellations + comets */
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');

let stars = [];
let comets = [];
let width, height;

function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function createStars(count = 140) {
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.2 + 0.3,
      alpha: Math.random() * 0.6 + 0.2,
      twinkleSpeed: Math.random() * 0.02 + 0.005
    });
  }
}

function createComet() {
  const fromLeft = Math.random() < 0.5;
  const startX = fromLeft ? -50 : width + 50;
  const startY = Math.random() * (height * 0.6);
  const angle = fromLeft ? (Math.random() * -0.3 - 0.2) : (Math.random() * -0.3 - 0.2);
  const speed = Math.random() * 4 + 3;

  comets.push({
    x: startX,
    y: startY,
    vx: Math.cos(angle) * speed * (fromLeft ? 1 : -1),
    vy: Math.sin(angle) * speed,
    life: 0,
    maxLife: 160
  });
}

function drawStars() {
  for (const s of stars) {
    s.alpha += (Math.random() - 0.5) * s.twinkleSpeed;
    s.alpha = Math.max(0.1, Math.min(0.8, s.alpha));

    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(248, 250, 252, ${s.alpha})`;
    ctx.fill();
  }
}

function drawConstellations() {
  ctx.lineWidth = 0.4;
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';

  for (let i = 0; i < stars.length; i++) {
    const s1 = stars[i];
    for (let j = i + 1; j < stars.length; j++) {
      const s2 = stars[j];
      const dx = s1.x - s2.x;
      const dy = s1.y - s2.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 90 && Math.random() < 0.002) {
        ctx.beginPath();
        ctx.moveTo(s1.x, s1.y);
        ctx.lineTo(s2.x, s2.y);
        ctx.stroke();
      }
    }
  }
}

function drawComets() {
  for (let i = comets.length - 1; i >= 0; i--) {
    const c = comets[i];
    c.x += c.vx;
    c.y += c.vy;
    c.life++;

    const t = c.life / c.maxLife;
    const alpha = Math.max(0, 1 - t);

    const tailX = c.x - c.vx * 4;
    const tailY = c.y - c.vy * 4;

    const grad = ctx.createLinearGradient(c.x, c.y, tailX, tailY);
    grad.addColorStop(0, `rgba(148, 163, 255, ${alpha})`);
    grad.addColorStop(1, 'rgba(15, 23, 42, 0)');

    ctx.beginPath();
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(c.x, c.y, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(248, 250, 252, ${alpha})`;
    ctx.fill();

    if (c.life > c.maxLife) {
      comets.splice(i, 1);
    }
  }

  if (Math.random() < 0.01 && comets.length < 2) {
    createComet();
  }
}

function animate() {
  ctx.clearRect(0, 0, width, height);
  drawStars();
  drawConstellations();
  drawComets();
  requestAnimationFrame(animate);
}

createStars();
animate();

/* Chat logic */
const messagesEl = document.getElementById('messages');
const chatContainer = document.getElementById('chat-container');
const form = document.getElementById('chat-form');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const statusEl = document.getElementById('status');

const MAX_CONTEXT = 20;
const history = [];

function isNearBottom(container, threshold = 40) {
  return container.scrollHeight - container.scrollTop - container.clientHeight < threshold;
}

function scrollToBottom() {
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function formatTimestamp(date = new Date()) {
  return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMessage(text, role, opts = {}) {
  const li = document.createElement('li');
  li.className = `message ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  li.appendChild(bubble);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = opts.meta || formatTimestamp();
  li.appendChild(meta);

  const shouldScroll = isNearBottom(chatContainer);
  messagesEl.appendChild(li);
  if (shouldScroll) scrollToBottom();

  return li;
}

let inFlight = null;

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || inFlight) return;

  addMessage(text, 'user');
  input.value = '';
  input.focus();

  const typingLi = document.createElement('li');
  typingLi.className = 'message bot';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = `
    <div class="typing-indicator-wrapper">
      <div class="typing-indicator">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  `;
  typingLi.appendChild(bubble);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = '...';
  typingLi.appendChild(meta);

  const shouldScroll = isNearBottom(chatContainer);
  messagesEl.appendChild(typingLi);
  if (shouldScroll) scrollToBottom();

  sendBtn.disabled = true;
  statusEl.textContent = 'Sending…';
  statusEl.setAttribute('aria-busy', 'true');

  const payloadHistory = history.slice(-(MAX_CONTEXT * 2));
  const controller = new AbortController();
  inFlight = controller;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: payloadHistory }),
      signal: controller.signal
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error(`Server error (${res.status}): ${errText || res.statusText}`);
    }

    const data = await res.json();

    bubble.textContent = data.response ?? '';
    meta.textContent = formatTimestamp();

    history.push({ role: 'user', content: text });
    history.push({ role: 'assistant', content: data.response });

    statusEl.textContent = 'Sent';
  } catch (err) {
    bubble.textContent = `Error: ${err.message}`;
    meta.textContent = formatTimestamp();
    statusEl.textContent = 'Failed to send';
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    statusEl.removeAttribute('aria-busy');
    inFlight = null;
  }
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

window.addEventListener('beforeunload', () => {
  if (inFlight) inFlight.abort();
});
</script>
</body>
</html>
